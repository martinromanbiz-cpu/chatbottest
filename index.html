<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>n8n chat demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" />
    <style>
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f6f8fb;
    color: #1f2937;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 24px;
  }

  h1 {
    font-size: 40px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  p.subtitle {
    font-size: 18px;
    color: #6b7280;
    max-width: 600px;
  }

  .features {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }

  .feature {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
    font-size: 15px;
  }
</style>
  </head>
  <body>
    <h1>Demo – Chat</h1>

    <script type="module">
      import { createChat } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

      createChat({
        webhookUrl: "https://martinroman36.app.n8n.cloud/webhook/ec382617-7a59-4c98-8cbd-5b184c9798ea/chat",
        mode: "window",
        showWelcomeScreen: true,
        initialMessages: ["Dobrý den, mohu vám pomoci?"]
      });
    </script>
  </body>
</html>
